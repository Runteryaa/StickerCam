plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smartcutout'
version = '1.0.0'

android {
  namespace "expo.modules.smartcutout"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  // Model gibi büyük varlıkların APK içinde sıkıştırılmadan saklanması gerekir;
  // aksi halde MediaPipe modeli doğrudan dosya olarak açamaz.
  androidResources {
    noCompress += ['task', 'tflite']
  }
}

dependencies {
  api 'com.google.mediapipe:tasks-vision:1.2.1'
}
