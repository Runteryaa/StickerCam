name: Build Android APK & OTA Update

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BUILD="${GITHUB_RUN_NUMBER}"
          export VERSION BUILD

          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.version = process.env.VERSION;
          config.expo.android.versionCode = Number(process.env.BUILD);
          fs.writeFileSync('app.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}-${BUILD}" >> "$GITHUB_ENV"
          echo "Building StickerCam ${VERSION} (${BUILD})"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_VERSION="27.1.12297006"

          if [ ! -d "$SDK_DIR/ndk/$NDK_VERSION" ]; then
            for attempt in 1 2 3; do
              if echo "y" | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"; then
                break
              fi
              echo "NDK install attempt $attempt failed; retrying..."
              sleep 10
            done
          fi

          test -d "$SDK_DIR/ndk/$NDK_VERSION"

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Build release APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalRelease

      - name: Rename APK
        run: |
          set -euo pipefail
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          mv "$APK" "StickerCam-${VERSION}-${BUILD}.apk"
          ls -lh "StickerCam-${VERSION}-${BUILD}.apk"

      - name: Publish OTA update
        if: ${{ env.EXPO_TOKEN != '' }}
        run: |
          npx --yes eas-cli@latest update \
            --channel production \
            --platform android \
            --environment production \
            --non-interactive \
            --message "StickerCam ${VERSION} (${BUILD}) - ${GITHUB_SHA::7}"

      - name: Warn when OTA is not configured
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "::warning::EXPO_TOKEN GitHub secret is missing; OTA update was skipped."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerCam-${{ env.VERSION }}-${{ env.BUILD }}
          path: StickerCam-*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: StickerCam ${{ env.VERSION }} (build ${{ env.BUILD }})
          body: |
            StickerCam ${{ env.VERSION }} (build ${{ env.BUILD }})
            Commit: ${{ github.sha }}
          files: StickerCam-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
